<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telo Bango</title>
<style>
:root{--n:#0f2a5c;--g:#c9a227;--b:#f1f5fb;--t:#1b2433}
@media(prefers-color-scheme:dark){:root{--n:#9db8f0;--g:#e0bc4a;--b:#141c2e;--t:#e8edf7}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 Georgia,serif;color:var(--t);background:var(--b)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;border-bottom:3px solid var(--g)}
header h1{margin:0;font-size:1.4rem;color:var(--n);flex:1}
.lg button{border:1px solid var(--n);background:none;color:var(--n);padding:4px 10px;cursor:pointer;font:inherit}
.lg button.on{background:var(--n);color:var(--b)}
nav{display:flex;overflow-x:auto;gap:4px;padding:8px 10px;background:var(--n)}
nav button{white-space:nowrap;border:0;background:none;color:#fff;padding:8px 12px;cursor:pointer;font:inherit;border-bottom:3px solid transparent}
nav button.on{border-color:var(--g);color:var(--g)}
main{max-width:820px;margin:auto;padding:16px}
h2{color:var(--n);border-left:5px solid var(--g);padding-left:10px}
.hero{padding:28px 16px;background:linear-gradient(135deg,#0f2a5c,#1d4a9a);color:#fff;text-align:center}
.hero h2{color:var(--g);border:0;font-size:1.7rem;margin:6px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--b);border:1px solid var(--g);padding:14px}
.card h3{margin:.2em 0;color:var(--n)}
.btn{background:var(--g);color:#1b1b1b;border:0;padding:11px 18px;font:bold 1rem Georgia,serif;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
label.o{display:flex;justify-content:space-between;gap:8px;padding:7px 4px;border-bottom:1px dotted #8aa}
input[type=text],input[type=tel],select,textarea{width:100%;padding:9px;margin:4px 0 10px;font:inherit;border:1px solid var(--n);background:#fff;color:#111}
.tot{font-size:1.2rem;color:var(--n);font-weight:bold}
.off{text-align:center;padding:22px;border:2px dashed var(--g)}
.logo{display:block;margin:0 auto 10px;max-height:110px;max-width:100%}
.pl{display:flex;gap:12px;align-items:center}.pl img{width:84px;height:84px;object-fit:contain;background:#fff}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:10px;z-index:9}
#md>div{background:var(--b);max-width:640px;max-height:92vh;overflow:auto;padding:16px;border-top:5px solid var(--g)}
#md p{margin:.5em 0;font-size:.93rem}
</style></head><body>

C:["<b>Entre</b> Telo Bango (« l'Organisateur ») <b>et</b> {n}, tél. {p}, ville {c} (« le Client »).",
"<b>1. Objet.</b> Le Client s'inscrit à : {i}, en mode {m}, pour {t} Ar.",
"<b>2. Paiement.</b> Mvola, Orange Money, Airtel Money ou espèces. Acompte de 50 % à l'inscription, solde au plus tard à la première séance. L'inscription est confirmée à la réception de l'acompte.",
"<b>3. Annulation et remboursement.</b> Remboursement intégral jusqu'à 48 h avant le début. Ensuite, l'acompte n'est pas remboursé. Si l'Organisateur annule, le Client est remboursé ou reporté, à son choix.",
"<b>4. Absences.</b> Une séance manquée n'est pas remplacée, sauf si le Client prévient 24 h à l'avance.",
"<b>5. Report.</b> En cas d'imprévu, l'Organisateur peut reporter une séance en prévenant le Client dès que possible.",
"<b>6. Droits du Client.</b> Le Client bénéficie des garanties et de la protection prévues par la loi n°2015-014 sur les garanties et la protection des consommateurs, dont le droit à une information claire sur la formation, son prix et ses conditions.",
"<b>7. Droits de l'Organisateur et des formateurs.</b> Les cours, supports et livres guides sont protégés par la loi n°94-036 sur la propriété littéraire et artistique. Ils sont réservés à l'usage personnel du Client. Toute copie, enregistrement, diffusion ou revente sans autorisation écrite est interdite. Le Client respecte les formateurs et les participants ; un comportement perturbateur répété peut entraîner l'exclusion sans remboursement.",
"<b>8. Données personnelles.</b> Conformément à la loi n°2014-038, les données du Client servent uniquement au suivi de son inscription et ne sont pas transmises à des tiers. Il peut les consulter, corriger ou supprimer sur demande.",
"<b>9. Acceptation électronique.</b> La case d'acceptation vaut accord, conformément aux lois n°2014-024 (transactions électroniques) et n°2014-025 (signature électronique).",
"<b>10. Litiges.</b> Recherche d'une solution amiable d'abord. À défaut, les tribunaux malgaches sont compétents et la loi malgache s'applique.",
"<b>11. Langues.</b> En cas de différence entre les versions française et malagasy, la version française prévaut."]},

C:["<b>Eo anelanelan'i</b> Telo Bango (ny « Mpikarakara ») <b>sy</b> {n}, finday {p}, tanàna {c} (ny « Mpanjifa »).",
"<b>1. Zava-misy.</b> Misoratra anarana amin'ny {i} ny Mpanjifa, amin'ny fomba {m}, vidiny {t} Ar.",
"<b>2. Fandoavana.</b> Mvola, Orange Money, Airtel Money na vola an-tanana. Avance 50 % amin'ny fisoratana anarana, ny sisa farafahatarany amin'ny fotoana voalohany. Voamarina ny fisoratana anarana rehefa voaray ny avance.",
"<b>3. Fanafoanana sy famerenana vola.</b> Averina manontolo ny vola hatramin'ny 48 ora alohan'ny fanombohana. Rehefa lany izany dia tsy averina ny avance. Raha foanan'ny Mpikarakara ny fiofanana, averina ny vola na afindra amin'ny daty hafa araka ny safidin'ny Mpanjifa.",
"<b>4. Tsy fahatongavana.</b> Tsy soloina ny fotoana tsy tonga, raha tsy nampandre 24 ora mialoha ny Mpanjifa.",
"<b>5. Fanemorana.</b> Raha misy tsy ampoizina, mety hatsahatra ny Mpikarakara ny fotoana ary hampandre ny Mpanjifa vetivety.",
"<b>6. Zon'ny Mpanjifa.</b> Mahazo ny antoka sy fiarovana voalazan'ny lalàna faha-2015-014 momba ny antoka sy fiarovana ny mpanjifa ny Mpanjifa, ao anatin'izany ny zo hahazo fampahalalana mazava momba ny fiofanana, ny vidiny sy ny fepetra.",
"<b>7. Zon'ny Mpikarakara sy ny mpampianatra.</b> Voaro araka ny lalàna faha-94-036 momba ny fananana ara-literatiora sy ara-kanto ny lesona, ny fitaovana ary ny boky torolalana. Natokana ho an'ny Mpanjifa ihany izy ireo. Voarara ny mandika, mandrakitra, mamoaka na mivarotra tsy misy alalana an-tsoratra. Manaja ny mpampianatra sy ny mpandray anjara ny Mpanjifa; ny fitondran-tena manelingelina miverimberina dia mety hahatonga ny fanesorana tsy misy famerenana vola.",
"<b>8. Angona manokana.</b> Araka ny lalàna faha-2014-038, ny angon'ny Mpanjifa dia ampiasaina ho an'ny fanaraha-maso ny fisoratana anarana ihany ary tsy omena olon-kafa. Afaka mangataka ny hijery, hanitsy na hamafa azy izy.",
"<b>9. Fanekena an-tserasera.</b> Ny boaty fanekena dia manaporofo ny fanekena, araka ny lalàna faha-2014-024 (fifanakalozana an-tserasera) sy faha-2014-025 (sonia elektronika).",
"<b>10. Fifandirana.</b> Mitady vahaolana am-pilaminana aloha. Raha tsy mety, ny fitsarana malagasy no manana fahefana ary ny lalàna malagasy no ampiharina.",
"<b>11. Fiteny.</b> Raha misy tsy fitoviana eo amin'ny dikan-teny frantsay sy malagasy, ny frantsay no ambony."]}};
